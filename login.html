<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Sign In | TeraCota</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef2f1;
        color: #202b2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #eef2f1;
      }

      button,
      input {
        font: inherit;
      }

      .login-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .login-header {
        min-height: 82px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 1px solid #445256;
        background: #293438;
        color: #ffffff;
        padding: 16px clamp(20px, 5vw, 64px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: #dfe93b;
        color: #263236;
        font-weight: 900;
      }

      .brand strong,
      .brand span {
        display: block;
      }

      .brand strong {
        font-size: 1.15rem;
      }

      .brand span,
      .environment-label {
        color: #c3ced1;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .environment-label {
        text-transform: uppercase;
      }

      .login-main {
        width: min(100%, 1180px);
        display: grid;
        place-items: center;
        margin: 0 auto;
        padding: clamp(36px, 8vh, 88px) 20px;
      }

      .login-panel {
        width: min(100%, 430px);
        border: 1px solid #c8d1d0;
        border-top: 4px solid #159b8c;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 45px rgba(32, 43, 47, 0.1);
        padding: clamp(26px, 5vw, 38px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #587075;
        font-size: 0.72rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 7vw, 2.2rem);
        line-height: 1.12;
      }

      .subtitle {
        margin: 10px 0 28px;
        color: #607176;
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 18px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      label {
        color: #34464b;
        font-size: 0.8rem;
        font-weight: 800;
      }

      input {
        width: 100%;
        min-height: 46px;
        border: 1px solid #aebbbb;
        border-radius: 6px;
        background: #fbfcfc;
        color: #202b2f;
        padding: 10px 12px;
        outline: none;
      }

      input:focus {
        border-color: #087e73;
        box-shadow: 0 0 0 3px rgba(8, 126, 115, 0.14);
      }

      .login-error {
        border: 1px solid #db8d86;
        border-radius: 6px;
        background: #fff1ef;
        color: #992f27;
        padding: 10px 12px;
        font-size: 0.86rem;
        font-weight: 750;
      }

      .login-button {
        min-height: 46px;
        border: 1px solid #087e73;
        border-radius: 6px;
        background: #087e73;
        color: #ffffff;
        cursor: pointer;
        font-weight: 850;
      }

      .login-button:hover {
        background: #076b63;
      }

      .login-footer {
        border-top: 1px solid #d5dddd;
        color: #6a7a7e;
        padding: 18px 20px;
        text-align: center;
        font-size: 0.78rem;
      }

      @media (max-width: 520px) {
        .login-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .environment-label {
          padding-left: 54px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <header class="login-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">TC</div>
          <div>
            <strong>TeraCota</strong>
            <span>Operations tracker</span>
          </div>
        </div>
        <span class="environment-label">Restricted access</span>
      </header>

      <main class="login-main">
        <section class="login-panel" aria-labelledby="loginTitle">
          <p class="eyebrow">Teraview engineering systems</p>
          <h1 id="loginTitle">Sign in to TeraCota</h1>
          <p class="subtitle">Operations and maintenance records</p>

          <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next_url }}" />
            {% if error %}
              <div class="login-error" role="alert">{{ error }}</div>
            {% endif %}
            <div class="field">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" autocomplete="username" required autofocus />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required />
            </div>
            <button class="login-button" type="submit">Log in</button>
          </form>
        </section>
      </main>

      <footer class="login-footer">TeraCota operations and maintenance</footer>
    </div>
  </body>
</html>
